<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Dünyanın En Sıkıcı Oyunu</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: #eeeeee;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #oyun {
        text-align: center;
        color: #333;
    }

    h1 {
        font-size: 32px;
        font-weight: normal;
    }

    #kare {
        width: 100px;
        height: 100px;
        background: #999999;
        margin: 50px auto;
    }

    #puan {
        font-size: 22px;
    }

    #mesaj {
        margin-top: 30px;
        color: #777;
    }
</style>
</head>

<body>

<div id="oyun">

    <h1>Dünyanın En Sıkıcı Oyunu</h1>

    <div id="kare"></div>

    <div id="puan">
        Sıkıcılık: 0
    </div>

    <div id="mesaj">
        Bekle...
    </div>

</div>

<script>

let sikicilik = 0;

setInterval(function() {

    sikicilik++;

    document.getElementById("puan").textContent =
        "Sıkıcılık: " + sikicilik;

    if (sikicilik === 10) {
        document.getElementById("mesaj").textContent =
            "Hâlâ hiçbir şey olmadı.";
    }

    if (sikicilik === 30) {
        document.getElementById("mesaj").textContent =
            "Cidden hâlâ bekliyor musun?";
    }

    if (sikicilik === 60) {
        document.getElementById("mesaj").textContent =
            "Tebrikler. Bir saattir... şaka, sadece bir dakika.";
    }

}, 1000);

</script>
