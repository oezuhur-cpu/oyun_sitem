<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gıcık Platform 😈</title>
<style>
    * { box-sizing:border-box; }
    body {
        margin:0;
        overflow:hidden;
        background:#111;
        font-family:Arial,sans-serif;
        color:white;
    }
    canvas {
        display:block;
        margin:auto;
        background:linear-gradient(#182848,#4b6cb7);
    }
    #info {
        position:fixed;
        top:10px;
        left:10px;
        font-size:18px;
        z-index:5;
        text-shadow:2px 2px #000;
    }
</style>
</head>
<body>

<div id="info">
    😈 GICIK PLATFORM &nbsp; | &nbsp;
    WASD / Oklar &nbsp; | &nbsp;
    R = Yeniden
</div>

<canvas id="game" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const keys = {};
document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if(e.key.toLowerCase()==="r") reset();
});
document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

let player, platforms, traps, goal, camera, deaths, level, message;

function reset(){
    player = {
        x:60,y:450,w:32,h:42,
        vx:0,vy:0,
        grounded:false
    };

    camera = 0;
    deaths = 0;
    level = 1;
    message = "😈 Hadi bakalım...";
    
    platforms = [
        {x:0,y:540,w:220,h:60},
        {x:280,y:470,w:130,h:25},
        {x:470,y:390,w:130,h:25},
        {x:680,y:320,w:130,h:25},
        {x:850,y:250,w:180,h:25},

        // Gıcık platformlar
        {x:1080,y:330,w:100,h:25,evil:true},
        {x:1240,y:250,w:100,h:25},
        {x:1410,y:360,w:120,h:25,evil:true},
        {x:1600,y:280,w:120,h:25},
        {x:1780,y:200,w:160,h:25},

        // Son bölüm
        {x:2020,y:300,w:100,h:25},
        {x:2180,y:220,w:100,h:25,evil:true},
        {x:2340,y:320,w:100,h:25},
        {x:2500,y:200,w:200,h:25}
    ];

    traps = [
        {x:220,y:570,w:60,h:30},
        {x:410,y:570,w:70,h:30},
        {x:600,y:570,w:80,h:30},
        {x:810,y:570,w:80,h:30},
        {x:1030,y:570,w:80,h:30},
        {x:1200,y:570,w:70,h:30},
        {x:1340,y:570,w:100,h:30},
        {x:1530,y:570,w:70,h:30},
        {x:1730,y:570,w:70,h:30},
        {x:1940,y:570,w:100,h:30},
        {x:2100,y:570,w:80,h:30},
        {x:2280,y:570,w:80,h:30},
        {x:2450,y:570,w:70,h:30}
    ];

    goal = {x:2590,y:130,w:60,h:70};
}

reset();

function die(reason){
    deaths++;
    message = reason;
    
    player.x = 60;
    player.y = 430;
    player.vx = 0;
    player.vy = 0;
    camera = 0;
}

function rectsCollide(a,b){
    return a.x < b.x+b.w &&
           a.x+a.w > b.x &&
           a.y < b.y+b.h &&
           a.y+a.h > b.y;
}

function update(){

    // Hareket
    if(keys["a"] || keys["arrowleft"])
        player.vx -= 0.7;

    if(keys["d"] || keys["arrowright"])
        player.vx += 0.7;

    player.vx *= 0.86;

    if((keys["w"] || keys["arrowup"] || keys[" "]) && player.grounded){
        player.vy = -13;
        player.grounded = false;
    }

    player.vy += 0.65;

    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;

    // Platform çarpışması
    for(let p of platforms){

        // Kötü platform bazen kayboluyor
        if(p.evil && Math.floor(Date.now()/500)%4===0)
            continue;

        if(
            player.vy >= 0 &&
            player.x+player.w > p.x &&
            player.x < p.x+p.w &&
            player.y+player.h >= p.y &&
            player.y+player.h <= p.y+25
        ){
            player.y = p.y-player.h;
            player.vy = 0;
            player.grounded = true;
        }
    }

    // Tuzaklar
    for(let t of traps){
        if(rectsCollide(player,t)){
            die("💀 OHA! TUZAĞA BASTIN!");
            return;
        }
    }

    // Düşme
    if(player.y > 650){
        die("😂 BOŞLUĞA ATLADIN!");
        return;
    }

    // Gıcık sürpriz:
    // 1000'i geçince bazı platformlar yer değiştiriyor
    if(player.x > 1000 && player.x < 2000){
        if(Math.random() < 0.008){
            let p = platforms[Math.floor(Math.random()*platforms.length)];
            if(p.x > 1000 && p.x < 2000){
                p.y += Math.random() > 0.5 ? 80 : -80;
                message = "😈 PLATFORMUN YERİ DEĞİŞTİ!";
            }
        }
    }

    // Kamera
    camera = player.x - 300;
    if(camera < 0) camera = 0;

    // Kazanma
    if(rectsCollide(player,goal)){
        message = "🏆 KAZANDIN!!! ...YOKSA? 😈";

        // Sahte zafer
        setTimeout(()=>{
            if(message.includes("KAZANDIN")){
                message = "😂 ŞAKA YAPTIM! SON BÖLÜM!";
                goal.x += 500;
                platforms.push({
                    x:2700,y:360,w:100,h:25
                });
                platforms.push({
                    x:2900,y:250,w:100,h:25,evil:true
                });
                platforms.push({
                    x:3100,y:150,w:200,h:25
                });
                goal.x = 3200;
            }
        },1000);
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(-camera,0);

    // Arka plan
    for(let x=0;x<4000;x+=100){
        ctx.fillStyle = "rgba(255,255,255,0.04)";
        ctx.fillRect(x,0,2,600);
    }

    // Tuzaklar
    for(let t of traps){
        ctx.fillStyle="#222";
        ctx.fillRect(t.x,t.y,t.w,t.h);

        ctx.fillStyle="#f33";
        for(let x=t.x;x<t.x+t.w;x+=20){
            ctx.beginPath();
            ctx.moveTo(x,t.y);
            ctx.lineTo(x+10,t.y-18);
            ctx.lineTo(x+20,t.y);
            ctx.fill();
        }
    }

    // Platformlar
    for(let p of platforms){

        if(p.evil && Math.floor(Date.now()/500)%4===0)
            continue;

        ctx.fillStyle = p.evil ? "#d33" : "#333";
        ctx.fillRect(p.x,p.y,p.w,p.h);

        ctx.fillStyle = p.evil ? "#ff7777" : "#777";
        ctx.fillRect(p.x,p.y,p.w,5);
    }

    // Goal
    ctx.fillStyle="#ffd700";
    ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

    ctx.fillStyle="#111";
    ctx.font="30px Arial";
    ctx.fillText("🏆",goal.x+10,goal.y+45);

    // Oyuncu
    ctx.fillStyle="#00e5ff";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    ctx.fillStyle="#111";
    ctx.fillRect(player.x+7,player.y+9,5,5);
    ctx.fillRect(player.x+21,player.y+9,5,5);

    ctx.restore();

    // UI
    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.fillText(message,20,570);

    ctx.fillText("Ölümler: "+deaths,820,30);

    requestAnimationFrame(draw);
}

function loop(){
    update();
    requestAnimationFrame(loop);
}

loop();
draw();
</script>

</body>
</html>
