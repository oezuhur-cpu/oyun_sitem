<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Pixel Ranger</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#080b10;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:monospace;
}
#wrap{
    position:relative;
    width:960px;
    max-width:96vw;
}
canvas{
    width:100%;
    display:block;
    image-rendering:pixelated;
    border:4px solid #303945;
    cursor:none;
    background:#18231b;
}
#start{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(4,7,10,.86);
    color:white;
    text-align:center;
}
#start h1{
    font-size:46px;
    margin:0 0 12px;
    color:#8ee66c;
    text-shadow:4px 4px #172016;
}
#start p{font-size:17px;color:#cbd5dc}
button{
    margin-top:18px;
    padding:14px 35px;
    font:700 20px monospace;
    background:#8ee66c;
    border:0;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="wrap">
<canvas id="game" width="960" height="540"></canvas>

<div id="start">
    <h1>PIXEL RANGER</h1>
    <p>Hareket eden robot hedefleri bul ve puanını yükselt!</p>
    <p>FARE: nişan al &nbsp; | &nbsp; SOL TIK: ateş</p>
    <button onclick="startGame()">BAŞLA</button>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let mouse={x:480,y:270};
let targets=[];
let particles=[];
let shots=[];
let score=0;
let combo=0;
let level=1;
let time=60;
let playing=false;
let lastTime=0;
let spawnTimer=0;
let flash=0;

const W=960,H=540;

canvas.addEventListener("mousemove",e=>{
    const r=canvas.getBoundingClientRect();
    mouse.x=(e.clientX-r.left)*W/r.width;
    mouse.y=(e.clientY-r.top)*H/r.height;
});

canvas.addEventListener("mousedown",e=>{
    if(!playing || e.button!==0)return;
    shoot();
});

function startGame(){
    document.getElementById("start").style.display="none";

    score=0;
    combo=0;
    level=1;
    time=60;
    targets=[];
    particles=[];
    shots=[];
    spawnTimer=0;
    playing=true;

    for(let i=0;i<4;i++) spawnTarget();

    lastTime=performance.now();
    requestAnimationFrame(loop);
}

function spawnTarget(){
    const side=Math.random()<.5 ? -1:1;

    targets.push({
        x:side<0?-50:W+50,
        y:210+Math.random()*230,
        vx:side<0?(1.2+Math.random()*1.4):-(1.2+Math.random()*1.4),
        phase:Math.random()*10,
        bob:Math.random()*Math.PI*2,
        size:28+Math.random()*7,
        type:Math.floor(Math.random()*3)
    });
}

function shoot(){
    flash=0.12;

    shots.push({
        x:mouse.x,
        y:mouse.y,
        life:.12
    });

    let hit=false;

    for(let i=targets.length-1;i>=0;i--){
        const t=targets[i];

        const dx=mouse.x-t.x;
        const dy=mouse.y-(t.y+Math.sin(t.bob)*8);
        const d=Math.sqrt(dx*dx+dy*dy);

        if(d<t.size+8){
            hit=true;

            score+=100+combo*20;
            combo++;

            burst(t.x,t.y, t.type===1 ? "#ffd34d":"#8ee66c");

            targets.splice(i,1);

            if(combo%8===0){
                level++;
            }

            break;
        }
    }

    if(!hit){
        combo=0;
    }
}

function burst(x,y,color){
    for(let i=0;i<20;i++){
        particles.push({
            x:x,
            y:y,
            vx:(Math.random()-.5)*7,
            vy:(Math.random()-.5)*7,
            life:.5+Math.random()*.5,
            color:color,
            size:2+Math.random()*4
        });
    }
}

function update(dt){

    time-=dt;

    if(time<=0){
        time=0;
        playing=false;
        gameOver();
        return;
    }

    spawnTimer-=dt;

    const spawnRate=Math.max(.45,1.25-level*.06);

    if(spawnTimer<=0){
        spawnTarget();
        spawnTimer=spawnRate;
    }

    for(let i=targets.length-1;i>=0;i--){
        const t=targets[i];

        t.x+=t.vx*(1+level*.08);
        t.bob+=dt*4;

        if(t.x<-100 || t.x>W+100){
            targets.splice(i,1);
            combo=0;
        }
    }

    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=.08;
        p.life-=dt;

        if(p.life<=0)particles.splice(i,1);
    }

    for(let i=shots.length-1;i>=0;i--){
        shots[i].life-=dt;
        if(shots[i].life<=0)shots.splice(i,1);
    }

    if(flash>0)flash-=dt;
}

function drawBackground(){

    // Gökyüzü
    ctx.fillStyle="#172735";
    ctx.fillRect(0,0,W,H);

    // Ay
    ctx.fillStyle="#d8dfb8";
    ctx.fillRect(790,65,30,30);
    ctx.fillStyle="#172735";
    ctx.fillRect(805,60,20,20);

    // Uzak dağlar
    ctx.fillStyle="#243b35";
    for(let x=0;x<W;x+=120){
        ctx.beginPath();
        ctx.moveTo(x,290);
        ctx.lineTo(x+60,180);
        ctx.lineTo(x+120,290);
        ctx.fill();
    }

    // Ağaç siluetleri
    for(let x=0;x<W;x+=75){
        drawTree(x,280+(x%50));
    }

    // Zemin
    ctx.fillStyle="#263d29";
    ctx.fillRect(0,310,W,230);

    // Piksel çimen
    for(let i=0;i<170;i++){
        const x=(i*73)%W;
        const y=320+(i*47)%210;

        ctx.fillStyle=i%3===0?"#3f6138":"#304d31";
        ctx.fillRect(x,y,3,8);
        ctx.fillRect(x+3,y-3,3,5);
    }

    // Yol
    ctx.fillStyle="#3b3b35";
    ctx.beginPath();
    ctx.moveTo(380,540);
    ctx.lineTo(470,310);
    ctx.lineTo(510,310);
    ctx.lineTo(650,540);
    ctx.fill();

    // Yol çizgileri
    ctx.fillStyle="#817d61";
    ctx.fillRect(478,350,7,35);
    ctx.fillRect(465,420,10,45);
    ctx.fillRect(450,500,13,40);
}

function drawTree(x,y){
    ctx.fillStyle="#17271c";
    ctx.fillRect(x+20,y,14,90);

    ctx.fillStyle="#1d3323";
    ctx.fillRect(x,y-25,55,55);
    ctx.fillRect(x+8,y-45,40,25);
    ctx.fillRect(x+15,y-60,25,18);

    ctx.fillStyle="#29452c";
    ctx.fillRect(x+5,y-15,12,12);
    ctx.fillRect(x+38,y-32,10,13);
}

function drawRobot(t){

    const y=t.y+Math.sin(t.bob)*8;
    const s=t.size;

    ctx.save();
    ctx.translate(t.x,y);

    // Gölge
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.fillRect(-s,-3, s*2,7);

    // Bacaklar
    ctx.fillStyle="#252c31";
    ctx.fillRect(-s*.55,10,s*.35,s*.75);
    ctx.fillRect(s*.2,10,s*.35,s*.75);

    // Gövde
    ctx.fillStyle=t.type===1?"#786b32":"#49545b";
    ctx.fillRect(-s*.7,-s*.35,s*1.4,s*1.1);

    // Zırh
    ctx.fillStyle=t.type===2?"#3f6d72":"#657179";
    ctx.fillRect(-s*.48,-s*.15,s*.96,s*.55);

    // Baş
    ctx.fillStyle="#737d83";
    ctx.fillRect(-s*.58,-s*1.05,s*1.16,s*.62);

    // Kulaklar
    ctx.fillStyle="#30383c";
    ctx.fillRect(-s*.75,-s*.85,s*.17,s*.32);
    ctx.fillRect(s*.58,-s*.85,s*.17,s*.32);

    // Göz paneli
    ctx.fillStyle="#111719";
    ctx.fillRect(-s*.42,-s*.88,s*.84,s*.28);

    // Gözler
    ctx.fillStyle="#72ef65";
    ctx.fillRect(-s*.27,-s*.81,s*.13,s*.1);
    ctx.fillRect(s*.14,-s*.81,s*.13,s*.1);

    // Göğüs ışığı
    ctx.fillStyle=t.type===1?"#ffd34d":"#65d9e8";
    ctx.fillRect(-s*.12,s*.05,s*.24,s*.18);

    // Kollar
    ctx.fillStyle="#30383d";
    ctx.fillRect(-s*.92,-s*.25,s*.22,s*.72);
    ctx.fillRect(s*.7,-s*.25,s*.22,s*.72);

    ctx.restore();
}

function drawParticles(){

    for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life);
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,p.size,p.size);
    }

    ctx.globalAlpha=1;
}

function drawHUD(){

    // Üst panel
    ctx.fillStyle="rgba(5,9,12,.78)";
    ctx.fillRect(0,0,W,62);

    ctx.fillStyle="#8ee66c";
    ctx.font="bold 21px monospace";
    ctx.fillText("PIXEL RANGER",20,27);

    ctx.fillStyle="white";
    ctx.font="17px monospace";
    ctx.fillText("SKOR: "+score,230,27);
    ctx.fillText("COMBO: x"+combo,390,27);
    ctx.fillText("SEVİYE: "+level,560,27);

    ctx.fillStyle=time<10?"#ff6868":"#fff";
    ctx.fillText("SÜRE: "+Math.ceil(time),760,27);

    // Alt bilgi
    ctx.fillStyle="rgba(5,9,12,.65)";
    ctx.fillRect(0,500,W,40);

    ctx.fillStyle="#d5dce0";
    ctx.font="14px monospace";
    ctx.fillText("SOL TIK  •  HEDEFLERİ VUR",20,525);
}

function drawScope(){

    // Hafif karartma
    ctx.fillStyle="rgba(0,0,0,.18)";
    ctx.fillRect(0,0,W,H);

    // Dürbün
    ctx.strokeStyle="rgba(220,240,220,.8)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(mouse.x,mouse.y,42,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(mouse.x-75,mouse.y);
    ctx.lineTo(mouse.x-12,mouse.y);

    ctx.moveTo(mouse.x+12,mouse.y);
    ctx.lineTo(mouse.x+75,mouse.y);

    ctx.moveTo(mouse.x,mouse.y-75);
    ctx.lineTo(mouse.x,mouse.y-12);

    ctx.moveTo(mouse.x,mouse.y+12);
    ctx.lineTo(mouse.x,mouse.y+75);
    ctx.stroke();

    ctx.fillStyle="#e8f5df";
    ctx.fillRect(mouse.x-2,mouse.y-2,4,4);

    // Köşe çizgileri
    ctx.strokeStyle="rgba(220,240,220,.3)";
    ctx.beginPath();
    ctx.moveTo(30,90);ctx.lineTo(30,130);ctx.lineTo(70,130);
    ctx.moveTo(890,90);ctx.lineTo(890,130);ctx.lineTo(850,130);
    ctx.moveTo(30,450);ctx.lineTo(30,410);ctx.lineTo(70,410);
    ctx.moveTo(890,450);ctx.lineTo(890,410);ctx.lineTo(850,410);
    ctx.stroke();
}

function draw(){

    drawBackground();

    for(const t of targets){
        drawRobot(t);
    }

    drawParticles();

    drawHUD();
    drawScope();

    if(flash>0){
        ctx.fillStyle="rgba(255,255,255,"+Math.min(.5,flash*4)+")";
        ctx.fillRect(0,0,W,H);
    }
}

function gameOver(){
    setTimeout(()=>{
        const start=document.getElementById("start");

        start.style.display="flex";
        start.innerHTML=`
            <h1>GÖREV BİTTİ</h1>
            <p>Skorun: <b>${score}</b></p>
            <p>Ulaştığın seviye: <b>${level}</b></p>
            <button onclick="startGame()">TEKRAR OYNA</button>
        `;
    },100);
}

function loop(now){

    if(!playing){
        draw();
        return;
    }

    const dt=Math.min((now-lastTime)/1000,.05);
    lastTime=now;

    update(dt);
    draw();

    if(playing){
        requestAnimationFrame(loop);
    }
}

draw();
</script>
