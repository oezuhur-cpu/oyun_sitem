<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Roguelike</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: #26351f;
        cursor: crosshair;
    }

    #info {
        position: fixed;
        top: 10px;
        left: 10px;
        font-size: 18px;
        z-index: 2;
        text-shadow: 2px 2px #000;
    }
</style>
</head>

<body>

<div id="info">
    ❤️ Can: <span id="hp">100</span>
    &nbsp;&nbsp;
    ☠️ Skor: <span id="score">0</span>
</div>

<canvas id="game" width="1000" height="650"></canvas>

<script>

// ======================================================
// CANVAS
// ======================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const hpText = document.getElementById("hp");
const scoreText = document.getElementById("score");

// ======================================================
// KLAVYE
// ======================================================

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    // Ölünce R ile yeniden başlat
    if (e.key.toLowerCase() === "r" && player.hp <= 0) {
        restartGame();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

// ======================================================
// FARE
// ======================================================

const mouse = {
    x: 0,
    y: 0,
    down: false
};

canvas.addEventListener("mousemove", e => {

    const rect = canvas.getBoundingClientRect();

    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

});

canvas.addEventListener("mousedown", () => {
    mouse.down = true;
});

canvas.addEventListener("mouseup", () => {
    mouse.down = false;
});

// ======================================================
// YARDIMCI FONKSİYONLAR
// ======================================================

function distance(x1, y1, x2, y2) {

    return Math.sqrt(
        (x2 - x1) ** 2 +
        (y2 - y1) ** 2
    );

}

function angleTo(x1, y1, x2, y2) {

    return Math.atan2(
        y2 - y1,
        x2 - x1
    );

}

// ======================================================
// DUVARLAR
// ======================================================

const walls = [

    { x: 180, y: 120, w: 180, h: 30 },
    { x: 600, y: 120, w: 180, h: 30 },

    { x: 180, y: 500, w: 180, h: 30 },
    { x: 600, y: 500, w: 180, h: 30 },

    { x: 80, y: 280, w: 180, h: 30 },
    { x: 740, y: 280, w: 180, h: 30 }

];

// ======================================================
// DUVAR ÇARPIŞMASI
// ======================================================

function circleRectCollision(circle, rect) {

    const closestX = Math.max(
        rect.x,
        Math.min(circle.x, rect.x + rect.w)
    );

    const closestY = Math.max(
        rect.y,
        Math.min(circle.y, rect.y + rect.h)
    );

    const dx = circle.x - closestX;
    const dy = circle.y - closestY;

    return dx * dx + dy * dy <
           circle.radius * circle.radius;
}

// ======================================================
// OYUNCU
// ======================================================

const player = {

    x: 500,
    y: 325,

    radius: 22,

    speed: 3.5,

    hp: 100,

    maxHp: 100,

    fireCooldown: 0,

    fireRate: 12

};

// ======================================================
// MERMİLER
// ======================================================

const bullets = [];

// ======================================================
// DÜŞMANLAR
// ======================================================

const enemies = [];

// ======================================================
// SKOR
// ======================================================

let score = 0;

// ======================================================
// DÜŞMAN OLUŞTUR
// ======================================================

function spawnEnemy() {

    let x;
    let y;

    // Kenarlardan birinden doğsun

    const side = Math.floor(Math.random() * 4);

    if (side === 0) {
        x = 30;
        y = Math.random() * canvas.height;
    }

    if (side === 1) {
        x = canvas.width - 30;
        y = Math.random() * canvas.height;
    }

    if (side === 2) {
        x = Math.random() * canvas.width;
        y = 30;
    }

    if (side === 3) {
        x = Math.random() * canvas.width;
        y = canvas.height - 30;
    }

    enemies.push({

        x: x,
        y: y,

        radius: 20,

        speed: 1.2 + Math.random() * 0.6,

        hp: 30,

        maxHp: 30

    });

}

// İlk düşmanlar

for (let i = 0; i < 5; i++) {
    spawnEnemy();
}

// ======================================================
// ATEŞ
// ======================================================

function shoot() {

    if (player.fireCooldown > 0) {
        return;
    }

    const angle = angleTo(
        player.x,
        player.y,
        mouse.x,
        mouse.y
    );

    bullets.push({

        x: player.x,
        y: player.y,

        radius: 5,

        speed: 8,

        dx: Math.cos(angle),
        dy: Math.sin(angle),

        damage: 10

    });

    player.fireCooldown = player.fireRate;

}

// ======================================================
// OYUNCU HAREKETİ
// ======================================================

function updatePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys["w"]) dy -= 1;
    if (keys["s"]) dy += 1;
    if (keys["a"]) dx -= 1;
    if (keys["d"]) dx += 1;

    // Çapraz hareketin daha hızlı olmasını engelle

    if (dx !== 0 || dy !== 0) {

        const length = Math.sqrt(
            dx * dx + dy * dy
        );

        dx /= length;
        dy /= length;

    }

    const oldX = player.x;
    const oldY = player.y;

    player.x += dx * player.speed;
    player.y += dy * player.speed;

    // Ekran sınırları

    player.x = Math.max(
        player.radius,
        Math.min(canvas.width - player.radius, player.x)
    );

    player.y = Math.max(
        player.radius,
        Math.min(canvas.height - player.radius, player.y)
    );

    // Duvar çarpışması

    for (const wall of walls) {

        if (circleRectCollision(player, wall)) {

            player.x = oldX;
            player.y = oldY;

        }

    }

}

// ======================================================
// MERMİLERİ GÜNCELLE
// ======================================================

function updateBullets() {

    for (let i = bullets.length - 1; i >= 0; i--) {

        const bullet = bullets[i];

        bullet.x += bullet.dx * bullet.speed;
        bullet.y += bullet.dy * bullet.speed;

        // Ekrandan çıktı

        if (
            bullet.x < 0 ||
            bullet.x > canvas.width ||
            bullet.y < 0 ||
            bullet.y > canvas.height
        ) {

            bullets.splice(i, 1);
            continue;

        }

        // Duvara çarpma

        let hitWall = false;

        for (const wall of walls) {

            if (circleRectCollision(bullet, wall)) {

                hitWall = true;
                break;

            }

        }

        if (hitWall) {

            bullets.splice(i, 1);
            continue;

        }

        // Düşmana çarpma

        for (let j = enemies.length - 1; j >= 0; j--) {

            const enemy = enemies[j];

            const dist = distance(
                bullet.x,
                bullet.y,
                enemy.x,
                enemy.y
            );

            if (
                dist <
                bullet.radius + enemy.radius
            ) {

                enemy.hp -= bullet.damage;

                bullets.splice(i, 1);

                if (enemy.hp <= 0) {

                    enemies.splice(j, 1);

                    score += 100;

                    // Her öldürmede bazen yeni düşman

                    if (Math.random() < 0.7) {
                        spawnEnemy();
                    }

                }

                break;

            }

        }

    }

}

// ======================================================
// DÜŞMANLARI GÜNCELLE
// ======================================================

function updateEnemies() {

    for (const enemy of enemies) {

        const angle = angleTo(
            enemy.x,
            enemy.y,
            player.x,
            player.y
        );

        const oldX = enemy.x;
        const oldY = enemy.y;

        enemy.x += Math.cos(angle) * enemy.speed;
        enemy.y += Math.sin(angle) * enemy.speed;

        // Duvarlar

        for (const wall of walls) {

            if (circleRectCollision(enemy, wall)) {

                enemy.x = oldX;
                enemy.y = oldY;

            }

        }

        // Oyuncuya çarpma

        const dist = distance(
            enemy.x,
            enemy.y,
            player.x,
            player.y
        );

        if (
            dist <
            enemy.radius + player.radius
        ) {

            player.hp -= 0.4;

        }

    }

}

// ======================================================
// ÇİZİM
// ======================================================

function drawBackground() {

    ctx.fillStyle = "#26351f";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Zemin çizgileri

    ctx.strokeStyle = "rgba(255,255,255,0.03)";

    for (let x = 0; x < canvas.width; x += 40) {

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);

        ctx.stroke();

    }

    for (let y = 0; y < canvas.height; y += 40) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);

        ctx.stroke();

    }

}

// ======================================================
// DUVARLARI ÇİZ
// ======================================================

function drawWalls() {

    for (const wall of walls) {

        ctx.fillStyle = "#555";

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle = "#222";

        ctx.strokeRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }

}

// ======================================================
// TANK ÇİZ
// ======================================================

function drawTank(tank, color) {

    const angle = angleTo(
        tank.x,
        tank.y,
        mouse.x,
        mouse.y
    );

    ctx.save();

    ctx.translate(
        tank.x,
        tank.y
    );

    // Tank gövdesi

    ctx.fillStyle = color;

    ctx.fillRect(
        -18,
        -16,
        36,
        32
    );

    // Tank paletleri

    ctx.fillStyle = "#222";

    ctx.fillRect(
        -22,
        -19,
        44,
        6
    );

    ctx.fillRect(
        -22,
        13,
        44,
        6
    );

    // Taret

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Namlu

    ctx.rotate(angle);

    ctx.fillStyle = "#333";

    ctx.fillRect(
        5,
        -4,
        30,
        8
    );

    ctx.restore();

}

// ======================================================
// DÜŞMAN ÇİZ
// ======================================================

function drawEnemies() {

    for (const enemy of enemies) {

        // Tank

        ctx.save();

        const angle = angleTo(
            enemy.x,
            enemy.y,
            player.x,
            player.y
        );

        ctx.translate(
            enemy.x,
            enemy.y
        );

        ctx.rotate(angle);

        ctx.fillStyle = "#a33";

        ctx.fillRect(
            -18,
            -16,
            36,
            32
        );

        ctx.fillStyle = "#222";

        ctx.fillRect(
            -22,
            -19,
            44,
            6
        );

        ctx.fillRect(
            -22,
            13,
            44,
            6
        );

        ctx.fillStyle = "#a33";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            12,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#333";

        ctx.fillRect(
            5,
            -4,
            28,
            8
        );

        ctx.restore();

        // Can barı

        ctx.fillStyle = "#222";

        ctx.fillRect(
            enemy.x - 20,
            enemy.y - 30,
            40,
            5
        );

        ctx.fillStyle = "#e33";

        ctx.fillRect(
            enemy.x - 20,
            enemy.y - 30,
            40 * (enemy.hp / enemy.maxHp),
            5
        );

    }

}

// ======================================================
// MERMİ ÇİZ
// ======================================================

function drawBullets() {

    for (const bullet of bullets) {

        ctx.fillStyle = "#ffd84d";

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}

// ======================================================
// OYUNCU CAN BAR
// ======================================================

function drawPlayerHP() {

    ctx.fillStyle = "#222";

    ctx.fillRect(
        player.x - 30,
        player.y - 38,
        60,
        7
    );

    ctx.fillStyle = "#35d35b";

    ctx.fillRect(
        player.x - 30,
        player.y - 38,
        60 * (player.hp / player.maxHp),
        7
    );

}

// ======================================================
// OYUN BİTTİ
// ======================================================

function drawGameOver() {

    if (player.hp > 0) {
        return;
    }

    ctx.fillStyle = "rgba(0,0,0,0.7)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.textAlign = "center";

    ctx.fillStyle = "white";

    ctx.font = "60px Arial";

    ctx.fillText(
        "TANK YOK OLDU!",
        canvas.width / 2,
        canvas.height / 2 - 30
    );

    ctx.font = "25px Arial";

    ctx.fillText(
        "R tuşuna basarak yeniden başla",
        canvas.width / 2,
        canvas.height / 2 + 30
    );

    ctx.textAlign = "left";

}

// ======================================================
// OYUNU YENİDEN BAŞLAT
// ======================================================

function restartGame() {

    player.x = 500;
    player.y = 325;

    player.hp = player.maxHp;

    score = 0;

    bullets.length = 0;
    enemies.length = 0;

    for (let i = 0; i < 5; i++) {
        spawnEnemy();
    }

}

// ======================================================
// GÜNCELLEME
// ======================================================

function update() {

    if (player.hp <= 0) {
        return;
    }

    updatePlayer();

    updateBullets();

    updateEnemies();

    if (player.fireCooldown > 0) {
        player.fireCooldown--;
    }

    if (mouse.down) {
        shoot();
    }

    hpText.textContent =
        Math.max(0, Math.floor(player.hp));

    scoreText.textContent =
        score;

}

// ======================================================
// ÇİZİM
// ======================================================

function draw() {

    drawBackground();

    drawWalls();

    drawBullets();

    drawEnemies();

    drawTank(player, "#3ca6ff");

    drawPlayerHP();

    drawGameOver();

}

// ======================================================
// ANA OYUN DÖNGÜSÜ
// ======================================================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>
