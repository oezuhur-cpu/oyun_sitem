<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Kaçış Arenası</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: #18212b;
    }

    #info {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 2px 2px #000;
    }

    #start {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,.8);
        z-index: 10;
        flex-direction: column;
    }

    button {
        padding: 15px 35px;
        font-size: 22px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="info">Skor: 0 | Can: ❤️❤️❤️ | Seviye: 1</div>

<div id="start">
    <h1>⚡ KAÇIŞ ARENASI ⚡</h1>
    <p>WASD / Ok Tuşları: Hareket</p>
    <p>SPACE: Şok dalgası</p>
    <button onclick="startGame()">OYUNA BAŞLA</button>
</div>

<canvas id="game" width="1000" height="650"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
let gameRunning = false;
let score = 0;
let level = 1;
let hp = 3;
let enemies = [];
let coins = [];
let powers = [];
let particles = [];
let lastEnemy = 0;
let lastCoin = 0;
let lastPower = 0;
let shake = 0;

const player = {
    x: 500,
    y: 325,
    size: 24,
    speed: 5,
    powerCooldown: 0
};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        e.preventDefault();
        shockwave();
    }

    if (e.key.toLowerCase() === "r" && !gameRunning) {
        startGame();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function startGame() {
    gameRunning = true;
    score = 0;
    level = 1;
    hp = 3;
    enemies = [];
    coins = [];
    powers = [];
    particles = [];

    player.x = 500;
    player.y = 325;

    document.getElementById("start").style.display = "none";
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);

    let x, y;

    if (side === 0) {
        x = Math.random() * canvas.width;
        y = -30;
    } else if (side === 1) {
        x = canvas.width + 30;
        y = Math.random() * canvas.height;
    } else if (side === 2) {
        x = Math.random() * canvas.width;
        y = canvas.height + 30;
    } else {
        x = -30;
        y = Math.random() * canvas.height;
    }

    enemies.push({
        x,
        y,
        size: 18 + Math.random() * 12,
        speed: 1.2 + level * .15 + Math.random()
    });
}

function spawnCoin() {
    coins.push({
        x: 40 + Math.random() * (canvas.width - 80),
        y: 70 + Math.random() * (canvas.height - 110),
        r: 9
    });
}

function spawnPower() {
    powers.push({
        x: 40 + Math.random() * (canvas.width - 80),
        y: 70 + Math.random() * (canvas.height - 110),
        r: 13
    });
}

function distance(a,b) {
    return Math.hypot(a.x-b.x, a.y-b.y);
}

function shockwave() {
    if (!gameRunning || player.powerCooldown > 0) return;

    player.powerCooldown = 120;

    enemies.forEach((enemy, i) => {
        if (distance(player, enemy) < 150) {
            createExplosion(enemy.x, enemy.y);
            enemies.splice(i, 1);
            score += 25;
        }
    });

    for (let i=0; i<30; i++) {
        particles.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(i) * (Math.random()*5),
            vy: Math.sin(i) * (Math.random()*5),
            life: 30
        });
    }
}

function createExplosion(x,y) {
    for (let i=0; i<15; i++) {
        particles.push({
            x,
            y,
            vx:(Math.random()-.5)*7,
            vy:(Math.random()-.5)*7,
            life:35
        });
    }
}

function update() {
    if (!gameRunning) return;

    // Oyuncu
    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"]) dy--;
    if (keys["s"] || keys["arrowdown"]) dy++;
    if (keys["a"] || keys["arrowleft"]) dx--;
    if (keys["d"] || keys["arrowright"]) dx++;

    if (dx || dy) {
        const len = Math.hypot(dx,dy);
        dx /= len;
        dy /= len;

        player.x += dx * player.speed;
        player.y += dy * player.speed;
    }

    player.x = Math.max(25, Math.min(canvas.width-25, player.x));
    player.y = Math.max(65, Math.min(canvas.height-25, player.y));

    if (player.powerCooldown > 0)
        player.powerCooldown--;

    // Seviye
    level = Math.floor(score / 500) + 1;

    // Düşman oluştur
    if (performance.now() - lastEnemy > Math.max(250, 900 - level*60)) {
        spawnEnemy();
        lastEnemy = performance.now();
    }

    if (performance.now() - lastCoin > 1000) {
        spawnCoin();
        lastCoin = performance.now();
    }

    if (performance.now() - lastPower > 7000) {
        spawnPower();
        lastPower = performance.now();
    }

    // Düşman hareketi
    enemies.forEach((enemy, i) => {
        const angle = Math.atan2(
            player.y-enemy.y,
            player.x-enemy.x
        );

        enemy.x += Math.cos(angle) * enemy.speed;
        enemy.y += Math.sin(angle) * enemy.speed;

        if (distance(player,enemy) < player.size + enemy.size) {
            enemies.splice(i,1);
            hp--;
            shake = 15;
            createExplosion(player.x,player.y);

            if (hp <= 0) {
                gameOver();
            }
        }
    });

    // Coin
    coins.forEach((coin,i) => {
        if (distance(player,coin) < 30) {
            coins.splice(i,1);
            score += 50;

            createExplosion(coin.x,coin.y);
        }
    });

    // Güç
    powers.forEach((power,i) => {
        if (distance(player,power) < 35) {
            powers.splice(i,1);

            // Güç alınca tüm düşmanlar gider
            enemies.forEach(e => createExplosion(e.x,e.y));
            score += enemies.length * 20;
            enemies = [];
        }
    });

    // Parçacıklar
    particles.forEach((p,i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        if (p.life <= 0)
            particles.splice(i,1);
    });

    if (score > 0 && score % 1000 < 10) {
        player.speed = 5 + level * .1;
    }

    updateUI();
}

function drawBackground() {
    ctx.fillStyle = "#18212b";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "#24313d";
    ctx.lineWidth = 1;

    for (let x=0; x<canvas.width; x+=50) {
        ctx.beginPath();
        ctx.moveTo(x,60);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for (let y=60; y<canvas.height; y+=50) {
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }

    ctx.fillStyle = "#0e151c";
    ctx.fillRect(0,0,canvas.width,60);
}

function drawPlayer() {
    ctx.save();

    ctx.translate(player.x,player.y);

    ctx.fillStyle = "#39ff88";
    ctx.beginPath();
    ctx.arc(0,0,player.size,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(-7,-5,4,0,Math.PI*2);
    ctx.arc(7,-5,4,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(-7,-5,2,0,Math.PI*2);
    ctx.arc(7,-5,2,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

    if (player.powerCooldown === 0) {
        ctx.strokeStyle = "rgba(50,255,150,.3)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(
            player.x,
            player.y,
            35 + Math.sin(Date.now()/100)*5,
            0,
            Math.PI*2
        );
        ctx.stroke();
    }
}

function draw() {
    ctx.save();

    if (shake > 0) {
        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );
        shake--;
    }

    drawBackground();

    // Coinler
    coins.forEach(c => {
        ctx.fillStyle = "#ffd83d";
        ctx.beginPath();
        ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#fff2a0";
        ctx.beginPath();
        ctx.arc(c.x-3,c.y-3,3,0,Math.PI*2);
        ctx.fill();
    });

    // Güçlendirme
    powers.forEach(p => {
        ctx.fillStyle = "#b44cff";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText("★",p.x,p.y+6);
    });

    // Düşmanlar
    enemies.forEach(e => {
        ctx.fillStyle = "#ff394f";
        ctx.beginPath();
        ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#500";
        ctx.beginPath();
        ctx.arc(e.x-6,e.y-3,3,0,Math.PI*2);
        ctx.arc(e.x+6,e.y-3,3,0,Math.PI*2);
        ctx.fill();
    });

    drawPlayer();

    // Parçacıklar
    particles.forEach(p => {
        ctx.fillStyle = "white";
        ctx.globalAlpha = p.life/35;
        ctx.fillRect(p.x,p.y,4,4);
        ctx.globalAlpha = 1;
    });

    ctx.restore();
}

function updateUI() {
    let hearts = "❤️".repeat(Math.max(0,hp));

    document.getElementById("info").textContent =
        `Skor: ${score} | Can: ${hearts} | Seviye: ${level}`;
}

function gameOver() {
    gameRunning = false;

    document.getElementById("start").style.display = "flex";

    document.querySelector("#start h1").textContent =
        "💀 OYUN BİTTİ 💀";

    document.querySelector("#start p").innerHTML =
        `Skorun: <b>${score}</b><br>Seviyen: <b>${level}</b><br><br>R tuşuna bas veya butona tıkla`;

    document.querySelector("#start button").textContent =
        "TEKRAR OYNA";
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

<a href="index.html" aria-label="Ana sayfaya dön" title="Ana sayfa" style="position:fixed;right:16px;bottom:16px;z-index:2147483647;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;background:#d8f26a;color:#202820;border:2px solid #202820;border-radius:7px;font:700 14px Arial,sans-serif;text-decoration:none;box-shadow:3px 3px 0 #202820;">Ana sayfa</a>
</body>
</html>
