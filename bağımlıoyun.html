<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON STRIKE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060b;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{
 position:fixed;left:20px;top:18px;color:white;
 font-weight:bold;font-size:18px;line-height:1.6;
 text-shadow:0 0 8px #00eaff;pointer-events:none
}
#ammo{
 position:fixed;right:25px;bottom:20px;color:white;
 font-size:30px;font-weight:bold;text-shadow:0 0 10px #ffea00;
 pointer-events:none
}
#message{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
 color:white;text-align:center;font-weight:bold;font-size:45px;
 text-shadow:0 0 20px #00eaff;pointer-events:none;
 opacity:0
}
#shop{
 display:none;position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 width:min(700px,90vw);padding:25px;
 background:rgba(5,8,20,.96);
 border:2px solid #00eaff;
 box-shadow:0 0 40px #00eaff;
 color:white;text-align:center;z-index:10
}
button{
 margin:10px;padding:14px 20px;background:#101a35;
 color:white;border:1px solid #00eaff;
 border-radius:8px;font-size:16px;cursor:pointer
}
button:hover{background:#15335c;box-shadow:0 0 15px #00eaff}
.small{font-size:15px;color:#9eefff}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud"></div>
<div id="ammo"></div>
<div id="message"></div>

<div id="shop">
 <h1>⚡ TUR BİTTİ ⚡</h1>
 <p id="shopText"></p>
 <button onclick="upgradeDamage()">🔫 HASAR +25% — $<span id="dmgCost"></span></button>
 <button onclick="upgradeSpeed()">🏃 HIZ +15% — $<span id="spdCost"></span></button>
 <button onclick="upgradeMaxHP()">❤️ CAN +25 — $<span id="hpCost"></span></button>
 <button onclick="upgradeMagazine()">💥 ŞARJÖR +5 — $<span id="magCost"></span></button>
 <br>
 <button onclick="nextWave()">🔥 SONRAKİ TUR</button>
 <p class="small">İpucu: SPACE ile dash at. Düşmanların arasından kaçabilirsin.</p>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const keys={};
let mouse={x:W/2,y:H/2,down:false};

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;

 if(e.key.toLowerCase()==="r") reload();
 if(e.code==="Space") dash();
 if(e.key.toLowerCase()==="p") paused=!paused;

 if(gameOver && e.key==="Enter") restart();
});

addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener("mousemove",e=>{
 mouse.x=e.clientX;
 mouse.y=e.clientY;
});

canvas.addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

let player;
let bullets=[];
let enemies=[];
let particles=[];
let texts=[];
let wave=1;
let score=0;
let money=0;
let combo=0;
let highCombo=0;
let paused=false;
let gameOver=false;

function resetPlayer(){
 player={
   x:W/2,y:H/2,
   r:17,
   hp:100,maxHp:100,
   speed:4,
   damage:25,
   magazine:15,
   ammo:15,
   reloadTime:0,
   fireCooldown:0,
   dashCooldown:0,
   inv:0
 };
}

resetPlayer();

function rand(a,b){return Math.random()*(b-a)+a}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function spawnEnemy(){
 let side=Math.floor(Math.random()*4);
 let x,y;

 if(side===0){x=-40;y=rand(0,H)}
 if(side===1){x=W+40;y=rand(0,H)}
 if(side===2){x=rand(0,W);y=-40}
 if(side===3){x=rand(0,W);y=H+40}

 let type=Math.random();

 let e;

 if(type<0.12 && wave>=3){
   e={
    x,y,r:27,
    hp:170+wave*30,
    maxHp:170+wave*30,
    speed:0.65+wave*.015,
    damage:22,
    color:"#ff1744",
    type:"tank",
    value:35
   };
 }else if(type<0.30){
   e={
    x,y,r:12,
    hp:35+wave*6,
    maxHp:35+wave*6,
    speed:2.0+wave*.04,
    damage:12,
    color:"#ffb300",
    type:"fast",
    value:20
   };
 }else{
   e={
    x,y,r:18,
    hp:65+wave*10,
    maxHp:65+wave*10,
    speed:1.05+wave*.025,
    damage:15,
    color:"#ff38f7",
    type:"normal",
    value:15
   };
 }

 enemies.push(e);
}

function waveCount(){
 return 5 + wave*3;
}

let spawned=0;
let spawnTimer=0;
let waveActive=true;

function startWave(){
 spawned=0;
 spawnTimer=0;
 waveActive=true;
 showMessage("DALGA "+wave,900);
}

function nextWave(){
 document.getElementById("shop").style.display="none";
 wave++;
 player.hp=Math.min(player.maxHp,player.hp+30);
 player.ammo=player.magazine;
 bullets=[];
 enemies=[];
 startWave();
}

function showMessage(t,time=1000){
 const el=document.getElementById("message");
 el.innerHTML=t;
 el.style.opacity=1;
 setTimeout(()=>el.style.opacity=0,time);
}

function shoot(){
 if(player.reloadTime>0 || player.fireCooldown>0 || player.ammo<=0)return;

 const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);

 bullets.push({
   x:player.x+Math.cos(a)*22,
   y:player.y+Math.sin(a)*22,
   vx:Math.cos(a)*12,
   vy:Math.sin(a)*12,
   damage:player.damage,
   life:70
 });

 player.ammo--;
 player.fireCooldown=8;

 for(let i=0;i<4;i++){
   particles.push({
    x:player.x+Math.cos(a)*23,
    y:player.y+Math.sin(a)*23,
    vx:Math.cos(a)*rand(3,7)+rand(-1,1),
    vy:Math.sin(a)*rand(3,7)+rand(-1,1),
    life:15,
    size:rand(2,5),
    color:"#ffe600"
   });
 }

 if(player.ammo===0) reload();
}

function reload(){
 if(player.reloadTime<=0 && player.ammo<player.magazine){
   player.reloadTime=70;
 }
}

function dash(){
 if(player.dashCooldown>0 || gameOver)return;

 let dx=0,dy=0;
 if(keys.w)dy--;
 if(keys.s)dy++;
 if(keys.a)dx--;
 if(keys.d)dx++;

 if(dx===0 && dy===0){
   const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);
   dx=Math.cos(a);dy=Math.sin(a);
 }else{
   const l=Math.hypot(dx,dy);
   dx/=l;dy/=l;
 }

 player.x+=dx*120;
 player.y+=dy*120;

 player.x=Math.max(25,Math.min(W-25,player.x));
 player.y=Math.max(25,Math.min(H-25,player.y));

 player.inv=25;
 player.dashCooldown=100;

 for(let i=0;i<20;i++){
  particles.push({
   x:player.x,y:player.y,
   vx:rand(-4,4),vy:rand(-4,4),
   life:30,size:rand(2,7),color:"#00eaff"
  });
 }
}

function updatePlayer(){
 let dx=0,dy=0;
 if(keys.w)dy--;
 if(keys.s)dy++;
 if(keys.a)dx--;
 if(keys.d)dx++;

 if(dx||dy){
   const l=Math.hypot(dx,dy);
   dx/=l;dy/=l;
   player.x+=dx*player.speed;
   player.y+=dy*player.speed;
 }

 player.x=Math.max(20,Math.min(W-20,player.x));
 player.y=Math.max(20,Math.min(H-20,player.y));

 if(player.fireCooldown>0)player.fireCooldown--;
 if(player.dashCooldown>0)player.dashCooldown--;
 if(player.inv>0)player.inv--;

 if(player.reloadTime>0){
   player.reloadTime--;
   if(player.reloadTime===0){
     player.ammo=player.magazine;
   }
 }

 if(mouse.down)shoot();
}

function updateBullets(){
 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];

  b.x+=b.vx;
  b.y+=b.vy;
  b.life--;

  let hit=false;

  for(let j=enemies.length-1;j>=0;j--){
   let e=enemies[j];

   if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){
    e.hp-=b.damage;
    hit=true;

    for(let k=0;k<8;k++){
     particles.push({
      x:b.x,y:b.y,
      vx:rand(-3,3),vy:rand(-3,3),
      life:25,size:rand(2,5),color:e.color
     });
    }

    if(e.hp<=0){
     killEnemy(j);
    }
    break;
   }
  }

  if(hit || b.life<=0 || b.x<0||b.x>W||b.y<0||b.y>H){
   bullets.splice(i,1);
  }
 }
}

function killEnemy(index){
 let e=enemies[index];

 enemies.splice(index,1);

 combo++;
 highCombo=Math.max(highCombo,combo);

 let multiplier=1+Math.floor(combo/5)*.25;
 let gain=Math.round(e.value*multiplier);

 score+=gain*10;
 money+=gain;

 texts.push({
   x:e.x,y:e.y-25,
   text:"+"+gain+"$  COMBO x"+combo,
   life:60
 });

 for(let i=0;i<25;i++){
  particles.push({
   x:e.x,y:e.y,
   vx:rand(-5,5),vy:rand(-5,5),
   life:rand(20,45),
   size:rand(2,7),
   color:e.color
  });
 }

 // Combo ödülü
 if(combo%10===0){
   money+=100;
   score+=1000;
   showMessage("🔥 "+combo+" COMBO! +100$",700);
 }
}

function updateEnemies(){
 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i];

  const a=Math.atan2(player.y-e.y,player.x-e.x);

  // Hafif taktiksel hareket
  let side=Math.sin(Date.now()/350+e.x)*0.25;

  e.x+=Math.cos(a)*e.speed-Math.sin(a)*side;
  e.y+=Math.sin(a)*e.speed+Math.cos(a)*side;

  const d=dist(e,player);

  if(d<e.r+player.r){
   if(player.inv<=0){
    player.hp-=e.damage*.025;
    combo=0;

    player.inv=8;

    if(player.hp<=0){
      endGame();
      return;
    }
   }

   // Düşmanı geri it
   e.x-=Math.cos(a)*4;
   e.y-=Math.sin(a)*4;
  }
 }
}

function updateParticles(){
 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];

  p.x+=p.vx;
  p.y+=p.vy;
  p.vx*=.96;
  p.vy*=.96;
  p.life--;

  if(p.life<=0)particles.splice(i,1);
 }

 for(let i=texts.length-1;i>=0;i--){
  texts[i].y-=.5;
  texts[i].life--;

  if(texts[i].life<=0)texts.splice(i,1);
 }
}

function spawnLogic(){
 if(!waveActive)return;

 spawnTimer--;

 if(spawned<waveCount() && spawnTimer<=0){
   spawnEnemy();
   spawned++;

   spawnTimer=Math.max(8,35-wave*1.5);
 }

 if(spawned>=waveCount() && enemies.length===0){
   waveActive=false;
   openShop();
 }
}

function openShop(){
 document.getElementById("shop").style.display="block";
 document.getElementById("shopText").innerHTML=
   `Skor: <b>${score}</b> · Para: <b>$${money}</b> · En yüksek combo: <b>${highCombo}</b><br>
    Dalga ${wave} tamamlandı!`;

 document.getElementById("dmgCost").textContent=100+player.damage*2;
 document.getElementById("spdCost").textContent=100+Math.round(player.speed*40);
 document.getElementById("hpCost").textContent=120+player.maxHp;
 document.getElementById("magCost").textContent=100+player.magazine*8;
}

function buy(cost,fn){
 if(money>=cost){
   money-=cost;
   fn();
   openShop();
 }else{
   showMessage("YETERLİ PARA YOK!",600);
 }
}

function upgradeDamage(){
 let cost=100+player.damage*2;
 buy(cost,()=>player.damage=Math.round(player.damage*1.25));
}

function upgradeSpeed(){
 let cost=100+Math.round(player.speed*40);
 buy(cost,()=>player.speed*=1.15);
}

function upgradeMaxHP(){
 let cost=120+player.maxHp;
 buy(cost,()=>{
   player.maxHp+=25;
   player.hp=player.maxHp;
 });
}

function upgradeMagazine(){
 let cost=100+player.magazine*8;
 buy(cost,()=>{
   player.magazine+=5;
   player.ammo=player.magazine;
 });
}

function endGame(){
 gameOver=true;
 paused=false;
 showMessage(
  `OYUN BİTTİ<br>
   <span style="font-size:22px">SKOR ${score} · DALGA ${wave}<br>
   ENTER = YENİDEN BAŞLA</span>`,
 999999999
 );
}

function restart(){
 player=null;
 bullets=[];
 enemies=[];
 particles=[];
 texts=[];
 wave=1;
 score=0;
 money=0;
 combo=0;
 highCombo=0;
 gameOver=false;

 resetPlayer();
 document.getElementById("message").style.opacity=0;
 document.getElementById("shop").style.display="none";

 startWave();
}

function drawBackground(){
 ctx.fillStyle="#05060b";
 ctx.fillRect(0,0,W,H);

 // Izgara
 ctx.strokeStyle="rgba(0,220,255,.07)";
 ctx.lineWidth=1;

 const grid=50;

 for(let x=0;x<W;x+=grid){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,H);
  ctx.stroke();
 }

 for(let y=0;y<H;y+=grid){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }

 // Hareketli neon çizgiler
 ctx.strokeStyle="rgba(255,0,200,.08)";

 for(let i=0;i<8;i++){
  let x=(Date.now()/10+i*150)%W;

  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x-250,H);
  ctx.stroke();
 }
}

function glowCircle(x,y,r,color){
 ctx.save();
 ctx.shadowBlur=25;
 ctx.shadowColor=color;
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.arc(x,y,r,0,Math.PI*2);
 ctx.fill();
 ctx.restore();
}

function drawPlayer(){
 const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);

 ctx.save();
 ctx.translate(player.x,player.y);
 ctx.rotate(a);

 if(player.inv%4<2){
  ctx.shadowBlur=25;
  ctx.shadowColor="#00eaff";

  ctx.fillStyle="#00eaff";
  ctx.beginPath();
  ctx.arc(0,0,player.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#07111c";
  ctx.beginPath();
  ctx.arc(0,0,10,0,Math.PI*2);
  ctx.fill();

  // Silah
  ctx.fillStyle="#ddd";
  ctx.fillRect(5,-5,25,10);

  ctx.fillStyle="#00eaff";
  ctx.fillRect(25,-3,8,6);
 }

 ctx.restore();

 // Can barı
 ctx.fillStyle="rgba(0,0,0,.7)";
 ctx.fillRect(player.x-30,player.y-35,60,7);

 ctx.fillStyle="#00ff88";
 ctx.fillRect(
   player.x-30,
   player.y-35,
   60*Math.max(0,player.hp/player.maxHp),
   7
 );
}

function drawEnemies(){
 for(const e of enemies){
  ctx.save();

  ctx.shadowBlur=20;
  ctx.shadowColor=e.color;
  ctx.fillStyle=e.color;

  ctx.beginPath();
  ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#070812";

  ctx.beginPath();
  ctx.arc(e.x,e.y,e.r*.45,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  // HP
  ctx.fillStyle="rgba(0,0,0,.7)";
  ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,5);

  ctx.fillStyle=e.color;
  ctx.fillRect(
   e.x-e.r,
   e.y-e.r-10,
   e.r*2*Math.max(0,e.hp/e.maxHp),
   5
  );
 }
}

function drawBullets(){
 for(const b of bullets){
  ctx.save();
  ctx.shadowBlur=15;
  ctx.shadowColor="#ffe600";
  ctx.fillStyle="#ffe600";

  ctx.beginPath();
  ctx.arc(b.x,b.y,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
 }
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/35);

  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,p.size,p.size);
 }

 ctx.globalAlpha=1;
}

function drawTexts(){
 ctx.font="bold 15px Arial";
 ctx.textAlign="center";

 for(const t of texts){
  ctx.globalAlpha=t.life/60;
  ctx.fillStyle="#fff";
  ctx.fillText(t.text,t.x,t.y);
 }

 ctx.globalAlpha=1;
}

function drawCrosshair(){
 ctx.strokeStyle="#fff";
 ctx.lineWidth=2;

 ctx.beginPath();
 ctx.arc(mouse.x,mouse.y,9,0,Math.PI*2);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(mouse.x-15,mouse.y);
 ctx.lineTo(mouse.x-6,mouse.y);
 ctx.moveTo(mouse.x+6,mouse.y);
 ctx.lineTo(mouse.x+15,mouse.y);
 ctx.moveTo(mouse.x,mouse.y-15);
 ctx.lineTo(mouse.x,mouse.y-6);
 ctx.moveTo(mouse.x,mouse.y+6);
 ctx.lineTo(mouse.x,mouse.y+15);
 ctx.stroke();
}

function draw(){
 drawBackground();
 drawParticles();
 drawBullets();
 drawEnemies();
 drawPlayer();
 drawTexts();
 drawCrosshair();

 document.getElementById("hud").innerHTML=
 `⚡ NEON STRIKE<br>
  ❤️ ${Math.ceil(player.hp)}/${player.maxHp}
  &nbsp; 💰 $${money}<br>
  🏆 ${score}
  &nbsp; 🔥 COMBO x${combo}<br>
  🌊 DALGA ${wave}
  ${player.dashCooldown<=0?"&nbsp; ⚡ DASH HAZIR":""}`;

 document.getElementById("ammo").innerHTML=
 player.reloadTime>0
 ? "🔄 DOLDURULUYOR..."
 : `🔫 ${player.ammo} / ${player.magazine}`;
}

function loop(){
 requestAnimationFrame(loop);

 if(!paused && !gameOver){
   updatePlayer();
   updateBullets();
   updateEnemies();
   updateParticles();
   spawnLogic();
 }

 draw();
}

startWave();
loop();
</script>

</body>
