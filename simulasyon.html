<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Real World Simulation</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#6fa85b;
}

#ui{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    background:rgba(0,0,0,.72);
    border-radius:12px;
    padding:14px;
    min-width:220px;
    box-shadow:0 5px 20px rgba(0,0,0,.5);
    user-select:none;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.stat{
    margin:6px 0;
    font-size:14px;
}

.bar{
    height:9px;
    background:#333;
    border-radius:5px;
    overflow:hidden;
    margin-top:3px;
}

.fill{
    height:100%;
    width:100%;
}

.health{background:#e33;}
.fuel{background:#e5b82e;}

#help{
    position:fixed;
    bottom:15px;
    left:15px;
    background:rgba(0,0,0,.65);
    color:white;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
}

#weather{
    position:fixed;
    top:15px;
    right:15px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
}

#message{
    position:fixed;
    left:50%;
    bottom:70px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.8);
    color:white;
    padding:12px 20px;
    border-radius:10px;
    opacity:0;
    transition:.3s;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div class="title">🌍 REAL WORLD</div>

    <div class="stat">
        ❤️ Sağlık
        <div class="bar">
            <div id="health" class="fill health"></div>
        </div>
    </div>

    <div class="stat">
        ⛽ Yakıt
        <div class="bar">
            <div id="fuel" class="fill fuel"></div>
        </div>
    </div>

    <div class="stat">💰 Para: <span id="money">1000</span> ₺</div>
    <div class="stat">🕒 Saat: <span id="clock">08:00</span></div>
    <div class="stat">🚗 Araç: <span id="vehicle">Yok</span></div>
</div>

<div id="weather">☀️ Açık</div>

<div id="help">
    WASD / Ok tuşları: Hareket<br>
    E: Araca bin / araçtan in<br>
    SHIFT: Hızlan<br>
    R: Benzin doldur
</div>

<div id="message"></div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
addEventListener("resize",resize);
resize();

/* =========================================================
   WORLD
========================================================= */

const WORLD_W = 5000;
const WORLD_H = 5000;

const keys = {};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())){
        e.preventDefault();
    }

    if(e.key.toLowerCase()==="e"){
        toggleVehicle();
    }

    if(e.key.toLowerCase()==="r"){
        refuel();
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

/* =========================================================
   CAMERA
========================================================= */

const camera = {
    x:2500,
    y:2500
};

/* =========================================================
   PLAYER
========================================================= */

const player = {
    x:2500,
    y:2500,
    radius:15,

    speed:2.5,
    sprint:1,

    health:100,
    fuel:100,
    money:1000,

    vehicle:null
};

/* =========================================================
   TIME
========================================================= */

let gameMinutes = 8 * 60;

function updateTime(dt){

    gameMinutes += dt * 0.35;

    if(gameMinutes >= 1440){
        gameMinutes -= 1440;
    }

    const h = Math.floor(gameMinutes/60);
    const m = Math.floor(gameMinutes%60);

    document.getElementById("clock").textContent =
        String(h).padStart(2,"0")+":"+
        String(m).padStart(2,"0");
}

function getDayLight(){

    const h = gameMinutes/60;

    if(h >= 7 && h < 18){
        return 0;
    }

    if(h >= 18 && h < 21){
        return (h-18)/3 * .55;
    }

    if(h >= 5 && h < 7){
        return (7-h)/2 * .45;
    }

    return .55;
}

/* =========================================================
   WEATHER
========================================================= */

const weatherTypes = [
    {
        name:"☀️ Açık",
        rain:false,
        color:null
    },
    {
        name:"☁️ Bulutlu",
        rain:false,
        color:"rgba(100,100,110,.15)"
    },
    {
        name:"🌧️ Yağmurlu",
        rain:true,
        color:"rgba(30,50,80,.18)"
    }
];

let weather = weatherTypes[0];
let weatherTimer = 20;

function updateWeather(dt){

    weatherTimer -= dt;

    if(weatherTimer <= 0){

        weather =
            weatherTypes[
                Math.floor(Math.random()*weatherTypes.length)
            ];

        weatherTimer = 25 + Math.random()*30;

        document.getElementById("weather").textContent =
            weather.name;
    }
}

/* =========================================================
   ROADS
========================================================= */

const roads = [];

function createRoads(){

    for(let x=500;x<WORLD_W;x+=700){

        roads.push({
            x:x-55,
            y:0,
            w:110,
            h:WORLD_H,
            vertical:true
        });

    }

    for(let y=500;y<WORLD_H;y+=700){

        roads.push({
            x:0,
            y:y-55,
            w:WORLD_W,
            h:110,
            vertical:false
        });

    }
}

createRoads();

/* =========================================================
   BUILDINGS
========================================================= */

const buildings = [];

function rectRoadCollision(x,y,w,h){

    for(const r of roads){

        if(
            x < r.x+r.w &&
            x+w > r.x &&
            y < r.y+r.h &&
            y+h > r.y
        ){
            return true;
        }
    }

    return false;
}

function createBuildings(){

    for(let x=80;x<WORLD_W-100;x+=150){

        for(let y=80;y<WORLD_H-100;y+=150){

            if(rectRoadCollision(x,y,110,110)){
                continue;
            }

            if(Math.random()<.78){

                const w=90+Math.random()*35;
                const h=90+Math.random()*35;

                buildings.push({
                    x,
                    y,
                    w,
                    h,
                    color:
                        ["#9b8d7a",
                         "#8f9da8",
                         "#b7a58b",
                         "#777f88",
                         "#a98970"]
                        [Math.floor(Math.random()*5)]
                });
            }
        }
    }
}

createBuildings();

/* =========================================================
   TRAFFIC LIGHTS
========================================================= */

const lights=[];

function createLights(){

    for(let x=500;x<WORLD_W;x+=700){

        for(let y=500;y<WORLD_H;y+=700){

            lights.push({
                x,
                y,
                timer:Math.random()*10,
                state:Math.random()<.5 ? "horizontal":"vertical"
            });

        }
    }
}

createLights();

/* =========================================================
   CARS
========================================================= */

const cars=[];

const carColors=[
    "#d33",
    "#3498db",
    "#f1c40f",
    "#eee",
    "#222",
    "#8e44ad",
    "#27ae60"
];

function createCar(){

    const vertical=Math.random()<.5;

    let x,y;

    if(vertical){

        x=
            500+
            Math.floor(Math.random()*
            Math.floor((WORLD_W-500)/700))
            *700;

        x+=Math.random()<.5?-20:20;

        y=Math.random()*WORLD_H;

    }else{

        y=
            500+
            Math.floor(Math.random()*
            Math.floor((WORLD_H-500)/700))
            *700;

        y+=Math.random()<.5?-20:20;

        x=Math.random()*WORLD_W;
    }

    cars.push({
        x,
        y,
        w:34,
        h:18,
        vertical,
        speed:1+Math.random()*1.5,
        color:carColors[
            Math.floor(Math.random()*carColors.length)
        ],
        occupied:false
    });
}

for(let i=0;i<70;i++){
    createCar();
}

/* =========================================================
   PEDESTRIANS
========================================================= */

const people=[];

const skinColors=[
    "#f2c09b",
    "#d49a72",
    "#8f6045",
    "#5e3b2d"
];

function createPerson(){

    people.push({

        x:Math.random()*WORLD_W,
        y:Math.random()*WORLD_H,

        vx:0,
        vy:0,

        speed:.25+Math.random()*.5,

        timer:0,

        color:
            skinColors[
                Math.floor(Math.random()*skinColors.length)
            ]
    });
}

for(let i=0;i<120;i++){
    createPerson();
}

/* =========================================================
   TREES
========================================================= */

const trees=[];

for(let i=0;i<350;i++){

    trees.push({
        x:Math.random()*WORLD_W,
        y:Math.random()*WORLD_H,
        size:8+Math.random()*12
    });

}

/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(cx,cy,r,rect){

    const nx=Math.max(
        rect.x,
        Math.min(cx,rect.x+rect.w)
    );

    const ny=Math.max(
        rect.y,
        Math.min(cy,rect.y+rect.h)
    );

    const dx=cx-nx;
    const dy=cy-ny;

    return dx*dx+dy*dy < r*r;
}

function blocked(x,y,r){

    for(const b of buildings){

        if(circleRectCollision(
            x,y,r,b
        )){
            return true;
        }
    }

    return false;
}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(dt){

    if(player.vehicle){

        driveVehicle(dt);
        return;
    }

    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"])dy--;
    if(keys["s"]||keys["arrowdown"])dy++;
    if(keys["a"]||keys["arrowleft"])dx--;
    if(keys["d"]||keys["arrowright"])dx++;

    if(dx===0 && dy===0)return;

    const len=Math.hypot(dx,dy);

    dx/=len;
    dy/=len;

    let speed=player.speed;

    if(keys["shift"]){
        speed*=1.8;
    }

    const nx=player.x+dx*speed*dt*60;
    const ny=player.y+dy*speed*dt*60;

    if(!blocked(nx,player.y,player.radius)){
        player.x=nx;
    }

    if(!blocked(player.x,ny,player.radius)){
        player.y=ny;
    }

    player.x=Math.max(20,Math.min(WORLD_W-20,player.x));
    player.y=Math.max(20,Math.min(WORLD_H-20,player.y));
}

/* =========================================================
   VEHICLE
========================================================= */

function nearestCar(){

    let best=null;
    let distance=Infinity;

    for(const car of cars){

        if(car.occupied)continue;

        const d=Math.hypot(
            car.x-player.x,
            car.y-player.y
        );

        if(d<distance){

            distance=d;
            best=car;

        }
    }

    return distance<60 ? best:null;
}

function toggleVehicle(){

    if(player.vehicle){

        player.x=player.vehicle.x+45;
        player.y=player.vehicle.y;

        player.vehicle.occupied=false;
        player.vehicle=null;

        document.getElementById("vehicle").textContent="Yok";

        showMessage("Araçtan indin.");

        return;
    }

    const car=nearestCar();

    if(!car){
        showMessage("Yakında araç yok.");
        return;
    }

    player.vehicle=car;
    car.occupied=true;

    document.getElementById("vehicle").textContent="Araçta";

    showMessage("Araca bindin!");
}

function driveVehicle(dt){

    const car=player.vehicle;

    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"])dy--;
    if(keys["s"]||keys["arrowdown"])dy++;
    if(keys["a"]||keys["arrowleft"])dx--;
    if(keys["d"]||keys["arrowright"])dx++;

    if(dx===0 && dy===0)return;

    const len=Math.hypot(dx,dy);

    dx/=len;
    dy/=len;

    let speed=3.5;

    if(keys["shift"]){
        speed=6;
    }

    if(player.fuel<=0){
        showMessage("Benzin bitti!");
        return;
    }

    const nx=car.x+dx*speed*dt*60;
    const ny=car.y+dy*speed*dt*60;

    if(
        nx>20 &&
        nx<WORLD_W-20 &&
        ny>20 &&
        ny<WORLD_H-20 &&
        !blocked(nx,ny,20)
    ){

        car.x=nx;
        car.y=ny;

        player.fuel-=speed*dt*.25;

    }

    player.x=car.x;
    player.y=car.y;
}

/* =========================================================
   FUEL
========================================================= */

function refuel(){

    if(player.vehicle===null){

        showMessage("Önce bir araca bin.");
        return;
    }

    if(player.money<100){

        showMessage("Benzin için 100 ₺ gerekiyor.");
        return;
    }

    player.money-=100;
    player.fuel=100;

    showMessage("⛽ Depo dolduruldu.");
}

/* =========================================================
   PEOPLE AI
========================================================= */

function updatePeople(dt){

    for(const p of people){

        p.timer-=dt;

        if(p.timer<=0){

            const a=Math.random()*Math.PI*2;

            p.vx=Math.cos(a)*p.speed;
            p.vy=Math.sin(a)*p.speed;

            p.timer=1+Math.random()*4;
        }

        const nx=p.x+p.vx*dt*60;
        const ny=p.y+p.vy*dt*60;

        if(!blocked(nx,ny,5)){

            p.x=nx;
            p.y=ny;

        }else{

            p.timer=0;
        }

        if(p.x<10)p.x=10;
        if(p.y<10)p.y=10;

        if(p.x>WORLD_W-10)p.x=WORLD_W-10;
        if(p.y>WORLD_H-10)p.y=WORLD_H-10;
    }
}

/* =========================================================
   TRAFFIC
========================================================= */

function updateCars(dt){

    for(const car of cars){

        if(car.occupied)continue;

        if(car.vertical){

            car.y+=car.speed*dt*60;

            if(car.y>WORLD_H+50){
                car.y=-50;
            }

        }else{

            car.x+=car.speed*dt*60;

            if(car.x>WORLD_W+50){
                car.x=-50;
            }
        }
    }
}

/* =========================================================
   TRAFFIC LIGHTS
========================================================= */

function updateLights(dt){

    for(const l of lights){

        l.timer+=dt;

        if(l.timer>8){

            l.timer=0;

            l.state=
                l.state==="horizontal"
                ?"vertical"
                :"horizontal";
        }
    }
}

/* =========================================================
   CAR COLLISION
========================================================= */

function vehicleCollisions(){

    if(player.vehicle)return;

    for(const car of cars){

        const d=Math.hypot(
            car.x-player.x,
            car.y-player.y
        );

        if(d<28){

            player.health-=.15;

            const dx=player.x-car.x;
            const dy=player.y-car.y;

            const len=Math.max(
                1,
                Math.hypot(dx,dy)
            );

            player.x+=dx/len*3;
            player.y+=dy/len*3;
        }
    }
}

/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    ctx.fillStyle="#72a85d";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    /* grass grid */

    ctx.strokeStyle="rgba(255,255,255,.025)";
    ctx.lineWidth=1;

    for(let x=0;x<WORLD_W;x+=100){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,WORLD_H);
        ctx.stroke();

    }

    for(let y=0;y<WORLD_H;y+=100){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(WORLD_W,y);
        ctx.stroke();

    }

    /* roads */

    for(const r of roads){

        ctx.fillStyle="#42464a";

        ctx.fillRect(
            r.x,
            r.y,
            r.w,
            r.h
        );

        ctx.strokeStyle="#666";
        ctx.lineWidth=2;

        if(r.vertical){

            for(let y=r.y;y<r.y+r.h;y+=40){

                ctx.beginPath();

                ctx.moveTo(
                    r.x+r.w/2,
                    y
                );

                ctx.lineTo(
                    r.x+r.w/2,
                    y+20
                );

                ctx.stroke();
            }

        }else{

            for(let x=r.x;x<r.x+r.w;x+=40){

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    r.y+r.h/2
                );

                ctx.lineTo(
                    x+20,
                    r.y+r.h/2
                );

                ctx.stroke();
            }
        }
    }

    /* trees */

    for(const t of trees){

        ctx.fillStyle="#5b3b20";

        ctx.fillRect(
            t.x-2,
            t.y,
            4,
            t.size
        );

        ctx.fillStyle="#236b2c";

        ctx.beginPath();

        ctx.arc(
            t.x,
            t.y,
            t.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* buildings */

    for(const b of buildings){

        ctx.fillStyle="rgba(0,0,0,.25)";

        ctx.fillRect(
            b.x+7,
            b.y+9,
            b.w,
            b.h
        );

        ctx.fillStyle=b.color;

        ctx.fillRect(
            b.x,
            b.y,
            b.w,
            b.h
        );

        /* roof */

        ctx.fillStyle="#4d4d4d";

        ctx.fillRect(
            b.x,
            b.y,
            b.w,
            8
        );

        /* windows */

        ctx.fillStyle="#d9e8e5";

        for(let wx=b.x+15;wx<b.x+b.w-10;wx+=25){

            for(let wy=b.y+22;wy<b.y+b.h-10;wy+=28){

                ctx.fillRect(
                    wx,
                    wy,
                    9,
                    12
                );
            }
        }
    }

    /* traffic lights */

    for(const l of lights){

        ctx.fillStyle="#222";

        ctx.fillRect(
            l.x-8,
            l.y-8,
            16,
            16
        );

        if(l.state==="horizontal"){

            ctx.fillStyle="#e33";

        }else{

            ctx.fillStyle="#2ecc71";
        }

        ctx.beginPath();

        ctx.arc(
            l.x,
            l.y,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* people */

    for(const p of people){

        ctx.fillStyle="rgba(0,0,0,.25)";

        ctx.beginPath();

        ctx.ellipse(
            p.x,
            p.y+7,
            5,
            3,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#315f9e";

        ctx.fillRect(
            p.x-4,
            p.y,
            8,
            10
        );

        ctx.fillStyle=p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y-4,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* cars */

    for(const car of cars){

        ctx.save();

        ctx.translate(
            car.x,
            car.y
        );

        if(car.vertical){
            ctx.rotate(Math.PI/2);
        }

        ctx.fillStyle="rgba(0,0,0,.3)";

        ctx.fillRect(
            -17,
            -7,
            38,
            20
        );

        ctx.fillStyle=car.color;

        ctx.fillRect(
            -17,
            -9,
            34,
            18
        );

        ctx.fillStyle="#202a30";

        ctx.fillRect(
            -8,
            -7,
            15,
            14
        );

        ctx.fillStyle="#eee";

        ctx.fillRect(
            12,
            -6,
            4,
            4
        );

        ctx.fillRect(
            12,
            2,
            4,
            4
        );

        ctx.restore();
    }

    /* player */

    if(!player.vehicle){

        ctx.fillStyle="rgba(0,0,0,.25)";

        ctx.beginPath();

        ctx.ellipse(
            player.x,
            player.y+12,
            9,
            4,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#246bce";

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            player.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            player.x-5,
            player.y-3,
            3,
            0,
            Math.PI*2
        );

        ctx.arc(
            player.x+5,
            player.y-3,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* =========================================================
   WEATHER DRAW
========================================================= */

function drawWeather(){

    const darkness=getDayLight();

    if(darkness>0){

        ctx.fillStyle=
            `rgba(10,15,40,${darkness})`;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    if(weather.rain){

        ctx.strokeStyle="rgba(180,210,255,.45)";
        ctx.lineWidth=1;

        for(let i=0;i<350;i++){

            const x=Math.random()*canvas.width;
            const y=Math.random()*canvas.height;

            ctx.beginPath();

            ctx.moveTo(x,y);

            ctx.lineTo(
                x-3,
                y+13
            );

            ctx.stroke();
        }
    }

    if(weather.color){

        ctx.fillStyle=weather.color;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    camera.x=
        player.x-
        canvas.width/2;

    camera.y=
        player.y-
        canvas.height/2;

    camera.x=Math.max(
        0,
        Math.min(
            WORLD_W-canvas.width,
            camera.x
        )
    );

    camera.y=Math.max(
        0,
        Math.min(
            WORLD_H-canvas.height,
            camera.y
        )
    );
}

/* =========================================================
   UI
========================================================= */

function updateUI(){

    document.getElementById("health").style.width=
        Math.max(
            0,
            player.health
        )+"%";

    document.getElementById("fuel").style.width=
        Math.max(
            0,
            player.fuel
        )+"%";

    document.getElementById("money").textContent=
        Math.floor(player.money);
}

function showMessage(text){

    const el=document.getElementById("message");

    el.textContent=text;
    el.style.opacity=1;

    clearTimeout(showMessage.timer);

    showMessage.timer=setTimeout(()=>{
        el.style.opacity=0;
    },1800);
}

/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    ctx.fillStyle="rgba(0,0,0,.8)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#fff";
    ctx.textAlign="center";

    ctx.font="bold 50px Arial";

    ctx.fillText(
        "OYUN BİTTİ",
        canvas.width/2,
        canvas.height/2
    );

    ctx.font="20px Arial";

    ctx.fillText(
        "Sayfayı yenileyerek tekrar başlayabilirsin.",
        canvas.width/2,
        canvas.height/2+45
    );
}

/* =========================================================
   MAIN LOOP
========================================================= */

let last=performance.now();
let dead=false;

function loop(now){

    const dt=Math.min(
        .05,
        (now-last)/1000
    );

    last=now;

    if(!dead){

        updateTime(dt);
        updateWeather(dt);
        updatePlayerSafe(dt);
        updatePeople(dt);
        updateCars(dt);
        updateLights(dt);
        vehicleCollisions();

        updateCamera();
        updateUI();

        drawWorld();
        drawWeather();

        if(player.health<=0){

            dead=true;
            gameOver();

        }
    }

    requestAnimationFrame(loop);
}

function updatePlayerSafe(dt){

    movePlayer(dt);

    player.health=Math.max(
        0,
        player.health
    );

    player.fuel=Math.max(
        0,
        player.fuel
    );
}

requestAnimationFrame(loop);

</script>
