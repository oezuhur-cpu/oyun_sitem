<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Dünyanın En Kolay Oyunu</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #222;
        font-family: Arial, sans-serif;
        color: white;
    }

    #oyun {
        text-align: center;
    }

    h1 {
        font-size: 40px;
    }

    #puan {
        font-size: 30px;
        margin: 20px;
    }

    button {
        font-size: 35px;
        padding: 25px 60px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        background: limegreen;
    }

    button:hover {
        transform: scale(1.05);
    }
</style>
</head>

<body>

<div id="oyun">
    <h1>🏆 Dünyanın En Kolay Oyunu</h1>

    <div id="puan">Puan: 0</div>

    <button onclick="puanArtir()">TIKLA!</button>
</div>

<script>
let puan = 0;

function puanArtir() {
    puan++;
    document.getElementById("puan").textContent = "Puan: " + puan;
}
</script>

</body>
</html>
