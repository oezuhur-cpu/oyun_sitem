<!DOCTYPE html>
<html lang="tr"><meta charset="UTF-8"><title>Son Cephe</title>
<style>
body{background:#10151b;color:white;text-align:center;font-family:Arial}
canvas{background:#202c30;max-width:100%;border:2px solid #738b86}
</style>
<h1>⚔️ SON CEPHE</h1><p>WASD: Hareket | Fare: Nişan ve ateş</p>
<canvas id="c" width="800" height="500"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let p={x:400,y:250,hp:100},keys={},bullets=[],enemies=[],score=0,over=false;
onkeydown=e=>keys[e.key.toLowerCase()]=true;
onkeyup=e=>keys[e.key.toLowerCase()]=false;
c.onclick=e=>{
if(over){p={x:400,y:250,hp:100};bullets=[];enemies=[];score=0;over=false;return}
let r=c.getBoundingClientRect(),tx=(e.clientX-r.left)*800/r.width,ty=(e.clientY-r.top)*500/r.height;
let a=Math.atan2(ty-p.y,tx-p.x);
bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8});
};
function loop(){
g.clearRect(0,0,800,500);
for(let i=0;i<800;i+=40)for(let j=0;j<500;j+=40){g.strokeStyle='#29383a';g.strokeRect(i,j,40,40)}
if(!over){
p.x+=((keys.d?1:0)-(keys.a?1:0))*3;
p.y+=((keys.s?1:0)-(keys.w?1:0))*3;
p.x=Math.max(12,Math.min(788,p.x));p.y=Math.max(12,Math.min(488,p.y));
if(Math.random()<.025)enemies.push({x:Math.random()<.5?0:800,y:Math.random()*500,hp:2});
bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
enemies.forEach(e=>{
let a=Math.atan2(p.y-e.y,p.x-e.x);
e.x+=Math.cos(a)*.8;e.y+=Math.sin(a)*.8;
bullets.forEach(b=>{if(Math.hypot(e.x-b.x,e.y-b.y)<18&&e.hp>0){e.hp=0;b.x=-100;score++}});
if(Math.hypot(e.x-p.x,e.y-p.y)<20)p.hp-=.2;
});
bullets=bullets.filter(b=>b.x>=0&&b.x<=800&&b.y>=0&&b.y<=500);
enemies=enemies.filter(e=>e.hp>0);
if(p.hp<=0)over=true;
}
g.fillStyle='#49d7ff';g.fillRect(p.x-10,p.y-10,20,20);
g.fillStyle='#ffcf40';bullets.forEach(b=>g.fillRect(b.x-3,b.y-3,6,6));
g.fillStyle='#ff5353';enemies.forEach(e=>g.fillRect(e.x-10,e.y-10,20,20));
g.fillStyle='white';g.font='20px Arial';
g.fillText('Sağlık: '+Math.ceil(p.hp)+'   Puan: '+score,15,25);
if(over)g.fillText('OYUN BİTTİ — Yeniden başlamak için tıkla',150,250);
requestAnimationFrame(loop)}
loop();
</script><a href="index.html" aria-label="Ana sayfaya dön" title="Ana sayfa" style="position:fixed;right:16px;bottom:16px;z-index:2147483647;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;background:#d8f26a;color:#202820;border:2px solid #202820;border-radius:7px;font:700 14px Arial,sans-serif;text-decoration:none;box-shadow:3px 3px 0 #202820;">Ana sayfa</a></html>
